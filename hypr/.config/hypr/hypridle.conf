general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after resume
}

listener {
    timeout = 150                               # 2.5 minutes
    on-timeout = brightnessctl -s set 10        # set monitor backlight to minimum
    on-resume = brightnessctl -r                # restore monitor backlight
}

listener {
    timeout = 300                               # 5 minutes
    on-timeout = loginctl lock-session          # lock screen
}

listener {
    timeout = 330                               # 5.5 minutes
    on-timeout = hyprctl dispatch dpms off      # turn off screens
    on-resume = hyprctl dispatch dpms on        # turn on screens when activity detected
}

listener {
    timeout = 1800                              # 30 minutes
    on-timeout = systemctl suspend              # suspend PC
}

