
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true                   # prevents lockout on accidental empty enters
}

background {
    monitor =
    path = /path/to/your/background.png         # supports png/jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 3
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Date/Time label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, 300
    halign = center
    valign = center
}
